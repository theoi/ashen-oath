name: Set up Godot
description: Installs the Godot editor (and optionally the single-threaded web export templates), cached across runs, and exports GODOT.
inputs:
  version:
    description: Godot version without the -stable suffix, e.g. 4.7.2
    required: true
  web-templates:
    description: Also install the web (no threads) export templates
    default: "false"
runs:
  using: composite
  steps:
    - name: Cache Godot editor
      id: cache-editor
      uses: actions/cache@v6
      with:
        path: ~/.cache/godot-ci/${{ inputs.version }}
        key: godot-editor-${{ inputs.version }}-linux-x86_64-v1

    - name: Download Godot editor
      if: steps.cache-editor.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        base="https://github.com/godotengine/godot/releases/download/${VERSION}-stable"
        zip="Godot_v${VERSION}-stable_linux.x86_64.zip"
        cd "$RUNNER_TEMP"
        curl -fsSL --retry 3 -o SHA512-SUMS.txt "$base/SHA512-SUMS.txt"
        curl -fsSL --retry 3 -o "$zip" "$base/$zip"
        grep " $zip\$" SHA512-SUMS.txt | sha512sum -c -
        mkdir -p ~/.cache/godot-ci/"$VERSION"
        unzip -q -o "$zip" -d ~/.cache/godot-ci/"$VERSION"
        rm "$zip"

    - name: Cache web export templates
      if: inputs.web-templates == 'true'
      id: cache-templates
      uses: actions/cache@v6
      with:
        path: ~/.local/share/godot/export_templates/${{ inputs.version }}.stable
        key: godot-templates-web-nothreads-${{ inputs.version }}-v1

    - name: Download web export templates
      if: inputs.web-templates == 'true' && steps.cache-templates.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        base="https://github.com/godotengine/godot/releases/download/${VERSION}-stable"
        tpz="Godot_v${VERSION}-stable_export_templates.tpz"
        cd "$RUNNER_TEMP"
        curl -fsSL --retry 3 -o SHA512-SUMS.txt "$base/SHA512-SUMS.txt"
        curl -fsSL --retry 3 -o "$tpz" "$base/$tpz"
        grep " $tpz\$" SHA512-SUMS.txt | sha512sum -c -
        dest=~/.local/share/godot/export_templates/"$VERSION".stable
        mkdir -p "$dest"
        # Only the single-threaded web templates are needed; the full archive is ~1.3 GB.
        unzip -q -j -o "$tpz" templates/version.txt templates/web_nothreads_release.zip \
          templates/web_nothreads_debug.zip -d "$dest"
        rm "$tpz"
        ls -la "$dest"

    - name: Export GODOT
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        bin=~/.cache/godot-ci/"$VERSION"/Godot_v${VERSION}-stable_linux.x86_64
        chmod +x "$bin"
        "$bin" --version
        echo "GODOT=$bin" >> "$GITHUB_ENV"
